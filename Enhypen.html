 <h2>Recent milestones</h2><ul class="tl">${T.slice(-5).reverse().map(tli).join('')}</ul><a class="btn" href="#timeline">Full timeline</a>`}

function grid(){
 const q=norm(F.q),r=A.filter(a=>(!F.type||a[3]==F.type)&&(!F.mk||a[4]==F.mk)&&(!F.yr||a[2].startsWith(F.yr))&&(!q||norm(a[1]+a[6]+a[7].join('')).includes(q))).sort((x,y)=>F.sort=='old'?x[2].localeCompare(y[2]):y[2].localeCompare(x[2]));
 $('#g').innerHTML=r.length?r.map(card).join(''):'<p class="empty">No releases match. Clear a filter or try a shorter title.</p>';
 $('#n').textContent=r.length+' of '+A.length+' releases';}
function disco(){
 const ty=[...new Set(A.map(a=>a[3]))].map(t=>[t,t]),yr=[...new Set(A.map(a=>a[2].slice(0,4)))].sort().reverse().map(y=>[y,y]);
 return `<h1>Discography</h1><div class="ctl"><input data-s="d" data-k="q" type="search" placeholder="Search releases and tracks" aria-label="Search releases" value="${esc(F.q)}"><select data-s="d" data-k="type" aria-label="Release type">${opts(ty,F.type,'All types')}</select><select data-s="d" data-k="mk" aria-label="Market">${opts(Object.entries(MK),F.mk,'All markets')}</select><select data-s="d" data-k="yr" aria-label="Year">${opts(yr,F.yr,'All years')}</select><select data-s="d" data-k="sort" aria-label="Sort order">${opts([['new','Newest first'],['old','Oldest first']],F.sort)}</select></div><p id="n" class="mute"></p><div class="g" id="g"></div>`}

function album(id){
 const a=A.find(x=>x[0]==id);if(!a)return nf();
 const tr=(a[6]?[a[6]]:[]).concat(a[7]),yr=a[2].slice(0,4),rel=A.filter(x=>x[0]!=id&&x[2].slice(0,4)==yr).slice(0,4),mv=MV.filter(m=>m[2]==id);
 return crumb(['discography','Discography'],a[1])+`<div class="ad"><div class="cv big" style="--h:${a[5]}">${art(a[0],a[5])}<span>${yr}</span><b>${esc(a[1])}</b></div><div><h1>${esc(a[1])}</h1>
 <dl><dt>Release date</dt><dd>${fmt(a[2])}</dd><dt>Type</dt><dd>${a[3]}</dd><dt>Market</dt><dd>${MK[a[4]]}</dd>${a[6]?'<dt>Title track</dt><dd>'+esc(a[6])+'</dd>':''}</dl>
 ${a[8]?'<p>'+esc(a[8])+'</p>':''}<div class="row">${fbtn('a:'+id)}<a class="btn" ${X} href="${sp(a[1])}">Search Spotify</a><a class="btn" ${X} href="${am(a[1])}">Search Apple Music</a><a class="btn" ${X} href="${yt(a[1])}">Search YouTube</a>${WP[id]?`<a class="btn" ${X} href="https://en.wikipedia.org/wiki/${WP[id]}">See official cover</a>`:''}</div></div></div>
 <h2>Verified tracks</h2><ul class="tr">${tr.map(t=>`<li><span class="th">${sart(t)}</span><a ${X} href="${sp(t)}">${esc(t)}</a></li>`).join('')}</ul>
 <p class="note">This is not the full ordered tracklist. Complete tracklists and durations are not verified yet. Track links open a Spotify search; there is no audio player on this site.</p>
 ${mv.length?'<h2>Music videos</h2><ul class="list">'+mv.map(vrow).join('')+'</ul>':''}
 ${rel.length?'<h2>Releases from '+yr+'</h2><div class="g">'+rel.map(card).join('')+'</div>':''}
 <p class="mute">Source: <a ${X} href="https://en.wikipedia.org/wiki/Enhypen_discography">Wikipedia, Enhypen discography</a>. Last checked Oct 23, 2026. Not yet cross-checked with BELIFT LAB.</p>`}

function vlist(){
 const q=norm(V.q),r=MV.filter(m=>(!V.yr||m[1]==V.yr)&&(!q||norm(m[0]).includes(q))).sort((x,y)=>y[1]-x[1]);
 $('#vl').innerHTML=r.length?r.map(vrow).join(''):'<li class="empty">No music videos match.</li>';}
function vids(){
 const yr=[...new Set(MV.map(m=>m[1]))].sort().reverse().map(y=>[y,y]);
 return `<h1>Music videos</h1><p class="note">Titles and years come from Wikipedia’s ENHYPEN discography. Video IDs are not verified yet, so nothing is embedded: each button opens a YouTube search. Wikipedia counts 32 music videos; this list has ${MV.length}, and choreography, performance and Japanese-version cuts are not all listed.</p><div class="ctl"><input data-s="v" data-k="q" type="search" placeholder="Search music videos" aria-label="Search music videos" value="${esc(V.q)}"><select data-s="v" data-k="yr" aria-label="Year">${opts(yr,V.yr,'All years')}</select></div><ul class="list" id="vl"></ul>`}

function mems(){return `<h1>Members</h1><p class="note">ENHYPEN has six members. Heeseung, who debuted with the group, left in March 2026.</p><h2>Current members</h2><div class="g">${M.filter(m=>m[6]).map(mcard).join('')}</div><h2>Former member</h2><div class="g">${M.filter(m=>!m[6]).map(mcard).join('')}</div>`}
function memb(id){
 const i=M.findIndex(m=>m[0]==id);if(i<0)return nf();
 const m=M[i],p=M[(i+M.length-1)%M.length],n=M[(i+1)%M.length];
 return crumb(['members','Members'],m[1])+`<div class="cv big" style="--h:${m[7]}">${port(m)}<span>${m[2]}</span><b>${m[1]}</b></div><small>Illustrated stand-in, not an official photo.</small><h1>${m[1]} <span class="ko">${m[2]}</span></h1><dl><dt>Birth name</dt><dd>${m[3]}</dd><dt>Birthday</dt><dd>${fmt(m[4])}</dd><dt>I-LAND final rank</dt><dd>${m[8]} of 7</dd><dt>Status</dt><dd>${m[6]?'Current member':'Former member'}</dd></dl>${m[5]?'<p>'+esc(m[5])+'</p>':''}${m[6]?'':'<p><a '+X+' href="https://www.koreatimes.co.kr/entertainment/k-pop/20260310/enhypens-heeseung-announces-departure-from-group">Korea Times report</a></p>'}
 <div class="row">${fbtn('m:'+id)}<a class="btn" ${X} href="${yt(m[1]+' official')}">Find videos on YouTube</a><a class="btn" ${X} href="https://beliftlab.com/enhypen">Official page (BELIFT LAB)</a></div>
 <p class="note">Birthdays and birth names come from several fan profile pages and are not checked against an official source. Birthplaces, positions, photos and per-member clips are not catalogued yet.</p>
 <div class="row"><a class="btn" href="#member-${p[0]}">Previous: ${p[1]}</a><a class="btn" href="#member-${n[0]}">Next: ${n[1]}</a><a class="btn" href="#members">All members</a></div>`}

function tl(){
 const ys=[...new Set(T.map(t=>t[0].slice(0,4)))];
 return `<h1>Timeline</h1><p>${T.length} milestones, checked against Wikipedia’s group and discography articles on Oct 23, 2026.</p><div class="row">${ys.map(y=>`<button class="btn" data-y="${y}">${y}</button>`).join('')}</div>`+ys.map(y=>`<section id="y${y}"><h2>${y}</h2><ul class="tl">${T.filter(t=>t[0].startsWith(y)).map(tli).join('')}</ul></section>`).join('')}

function saved(){
 const it=mem.fav.map(k=>{const i=k.indexOf(':'),t=k.slice(0,i),v=k.slice(i+1);
  if(t=='a'){const a=A.find(x=>x[0]==v);return a&&{t,h:card(a)}}
  if(t=='v'){const m=MV.find(x=>x[0]==v);return m&&{t,h:vrow(m)}}
  if(t=='m'){const m=M.find(x=>x[0]==v);return m&&{t,h:mcard(m)}}}).filter(Boolean);
 const g=t=>it.filter(i=>i.t==t).map(i=>i.h).join('');
 return `<h1>Saved</h1><p class="note">Saved items stay in this browser. If storage is blocked, they last only until you close the page.</p>`+(it.length?(g('a')?'<h2>Releases</h2><div class="g">'+g('a')+'</div>':'')+(g('v')?'<h2>Music videos</h2><ul class="list">'+g('v')+'</ul>':'')+(g('m')?'<h2>Members</h2><div class="g">'+g('m')+'</div>':''):'<p class="empty">Nothing saved yet. Use Save on a release, music video or member.</p>')}

function srch(){
 const q=norm(Q),f=(r,fn)=>q?r.filter(x=>norm(fn(x)).includes(q)):[];
 const a=f(A,x=>x[1]+x[6]+x[7].join('')),v=f(MV,x=>x[0]),m=f(M,x=>x[1]+x[2]+x[3]),t=f(T,x=>x[1]+x[2]),n=a.length+v.length+m.length+t.length;
 return `<h1>Search</h1><p>${q?n+' results for “'+esc(Q)+'”':'Type a title, member or event in the search box above.'}</p>`+(a.length?'<h2>Releases</h2><div class="g">'+a.map(card).join('')+'</div>':'')+(v.length?'<h2>Music videos</h2><ul class="list">'+v.map(vrow).join('')+'</ul>':'')+(m.length?'<h2>Members</h2><div class="g">'+m.map(mcard).join('')+'</div>':'')+(t.length?'<h2>Timeline</h2><ul class="tl">'+t.map(tli).join('')+'</ul>':'')+(q&&!n?'<p class="empty">No matches. Try fewer letters or another spelling; “senko” finds Senkō.</p>':'')}

function songs(){
 const r=[...SG].sort((x,y)=>norm(x[0]).localeCompare(norm(y[0])));
 return `<h1>Songs</h1><p class="note">${r.length} song titles named in this archive. Pictures are original stand-in art, not official cover images. Each title opens a Spotify search.</p><ul class="tr">${r.map(([t,a])=>`<li><span class="th">${sart(t)}</span><div><a ${X} href="${sp(t)}">${esc(t)}</a><small>${esc(a[1])}, ${a[2].slice(0,4)}</small></div><a class="btn" style="margin-left:auto" href="#album-${a[0]}">Album</a></li>`).join('')}</ul>`}
function about(){
 const tn=A.reduce((s,a)=>s+(a[6]?1:0)+a[7].length,0);
 return `<h1>About</h1><p>ENGENE Archive is an independent fan project. It is not affiliated with or endorsed by ENHYPEN, BELIFT LAB or HYBE. Names and marks belong to their owners, and all music and video stays with the original publishers.</p>
 <h2>What is in here</h2><ul><li>${A.length} releases with dates, types and markets, checked Oct 23, 2026 against Wikipedia’s discography article.</li><li>${tn} named tracks. Full ordered tracklists and durations are unverified.</li><li>${MV.length} music videos listed; Wikipedia counts 32.</li><li>${M.length} members and ${T.length} timeline milestones.</li></ul>
 <h2>Known gaps</h2><ul><li>No cross-check yet against BELIFT LAB, the official YouTube channels or Universal Music Japan.</li><li>No official photos or cover art: this hosted page cannot load remote images, and member photos and cover art are copyrighted. Every album, song and member has original generated stand-in art instead. Album pages link to the official cover on Wikipedia.</li><li>No YouTube video IDs or embeds, and no dance practices, teasers, behind-the-scenes, variety, concert or short-form clips.</li><li>No photo gallery or music player.</li><li>Birthdays come from fan profile pages.</li></ul>
 <h2>Sources</h2><ul><li><a ${X} href="https://en.wikipedia.org/wiki/Enhypen_discography">Wikipedia: Enhypen discography</a></li><li><a ${X} href="https://en.wikipedia.org/wiki/Enhypen">Wikipedia: Enhypen</a></li><li><a ${X} href="https://www.koreatimes.co.kr/entertainment/k-pop/20260310/enhypens-heeseung-announces-departure-from-group">Korea Times: Heeseung announcement</a></li><li><a ${X} href="https://www.billboard.com/music/chart-beat/enhypen-number-one-billboard-200-the-sin-bliss-1236328323/">Billboard: The Sin: Bliss at number one</a></li><li><a ${X} href="https://beliftlab.com/enhypen">BELIFT LAB ENHYPEN page</a> (listed by Wikipedia, not yet used as a data source)</li></ul>
 <h2>Adding new records</h2><p>Releases, videos, members and milestones are plain lists at the top of the page’s code. New rows appear in filters, search and detail pages automatically.</p>`}

function render(){
 const t=(location.hash||'#home').slice(1)||'home';let h;
 if(t=='home')h=home();else if(t=='discography')h=disco();else if(t.startsWith('album-'))h=album(t.slice(6));else if(t=='videos')h=vids();else if(t=='members')h=mems();else if(t.startsWith('member-'))h=memb(t.slice(7));else if(t=='timeline')h=tl();else if(t=='saved')h=saved();else if(t=='search')h=srch();else if(t=='about')h=about();else if(t=='songs')h=songs();else h=nf();
 app.innerHTML=h;
 if(t=='discography')grid();if(t=='videos')vlist();
 document.querySelectorAll('nav a').forEach(a=>{const k=a.getAttribute('href').slice(1),on=k==t||(k=='discography'&&t.startsWith('album-'))||(k=='members'&&t.startsWith('member-'));on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 const h1=app.querySelector('h1');document.title=(h1?h1.textContent.trim()+' | ':'')+'ENGENE Archive';
 scrollTo(0,0);app.focus({preventScroll:true});}

app.addEventListener('click',e=>{
 const b=e.target.closest('[data-f]');
 if(b){tog(b.dataset.f);const on=isFav(b.dataset.f);b.setAttribute('aria-pressed',on);b.textContent=on?'Saved':'Save';if(location.hash=='#saved')render();return}
 const y=e.target.closest('[data-y]');
 if(y){const el=document.getElementById('y'+y.dataset.y);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth'})}});
app.addEventListener('input',e=>{const d=e.target.dataset;if(!d.s)return;(d.s=='d'?F:V)[d.k]=e.target.value;d.s=='d'?grid():vlist()});
$('#sf').addEventListener('submit',e=>{e.preventDefault();Q=$('#q').value.trim();if(location.hash=='#search')render();else location.hash='search'});
$('#sug').innerHTML=[...A.map(a=>a[1]),...MV.map(m=>m[0]),...M.map(m=>m[1])].filter((v,i,r)=>r.indexOf(v)==i).map(v=>'<option value="'+esc(v)+'">').join('');
addEventListener('hashchange',render);render();
</script></body></html>
