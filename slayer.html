<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demon Slayer: Survival Arena</title>
<style>
    body, html { margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; font-family: monospace; user-select: none; }
    canvas { display: block; }
    #uiLayer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; padding: 20px; box-sizing: border-box; }
    .hud-box { background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid #444; border-radius: 5px; margin-bottom: 10px; pointer-events: auto; }
    #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10,10,15,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 100; text-align: center;}
    #startBtn, #retryBtn { padding: 15px 30px; font-size: 24px; background: darkred; color: white; border: 2px solid white; cursor: pointer; text-transform: uppercase; font-weight: bold;}
    #startBtn:hover, #retryBtn:hover { background: red; }
    .bar-container { width: 200px; height: 15px; background: #222; border: 1px solid #fff; margin-top: 5px; }
    .bar-fill { height: 100%; transition: width 0.1s; }
    #hpBar { background: #e74c3c; width: 100%; }
    #stamBar { background: #f1c40f; width: 100%; }
    #breathBar { background: #3498db; width: 0%; }
    .controls-help { font-size: 12px; color: #aaa; margin-top: 10px; }
    #comboDisplay { position: absolute; top: 20%; right: 5%; font-size: 48px; color: #f39c12; font-style: italic; opacity: 0; transition: opacity 0.2s; text-shadow: 2px 2px 0 #000; }
    #centerMessage { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 32px; color: white; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none;}
    #formList { font-size: 12px; line-height: 1.5; color: #ccc; max-height: 150px; overflow: hidden;}
    .active-form { color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px currentColor; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
