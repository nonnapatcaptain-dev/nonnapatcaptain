<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breath of the Blade — Demon Slayer Arena</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07060b;}
  canvas{display:block;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

const PI = Math.PI, TAU = PI * 2;

/* ================= CANVAS ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* ================= MATH ================= */
const rand = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a + (b-a)*t;
function angDiff(a,b){
  let d = (a-b)%TAU;
  if (d>PI) d-=TAU;
  if (d<-PI) d+=TAU;
  return d;
}
function rr(x,y,w,h,r){
  if(w<0)w=0; if(h<0)h=0;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ================= GLOW SPRITES ================= */
function makeGlow(rgb){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,   'rgba(255,255,255,0.95)');
  grd.addColorStop(0.22,'rgba('+rgb+',0.85)');
  grd.addColorStop(0.55,'rgba('+rgb+',0.28)');
  grd.addColorStop(1,   'rgba('+rgb+',0)');
  g.fillStyle = grd;
  g.fillRect(0,0,64,64);
  return c;
}
const SPR = {
  fire:      makeGlow('255,140,40'),
  fireHot:   makeGlow('255,235,150'),
  fireDeep:  makeGlow('255,60,10'),
  water:     makeGlow('120,220,255'),
  waterDeep: makeGlow('40,140,255'),
  thunder:   makeGlow('255,245,140'),
  wind:      makeGlow('180,255,215'),
  blood:     makeGlow('255,60,100'),
  white:     makeGlow('255,255,255')
};

/* ================= INPUT ================= */
const input = { keys:{}, mx:0, my:0, down:false };
const pressed = new Set();
const normKey = e => e.key.length===1 ? e.key.toLowerCase() : e.key;

window.addEventListener('keydown', e=>{
  const k = normKey(e);
  if(!input.keys[k]) pressed.add(k);
  input.keys[k] = true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ input.keys[normKey(e)] = false; });
window.addEventListener('mousemove', e=>{ input.mx = e.clientX; input.my = e.clientY; });
cv.addEventListener('mousedown', e=>{
  if(e.button===0){ input.down = true; pressed.add('mouse0'); }
  if(e.button===2){ pressed.add('mouse2'); }
  e.preventDefault();
  initAudio();
});
window.addEventListener('mouseup', e=>{ if(e.button===0) input.down = false; });
window.addEventListener('contextmenu', e=> e.preventDefault());
window.addEventListener('blur', ()=>{ input.keys={}; input.down=false; });
window.addEventListener('wheel', e=>{
  if(state==='playing') selectForm(player.formIdx + (e.deltaY>0?1:-1));
}, {passive:true});

/* ================= AUDIO ================= */
let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function sfx(freq,dur,type,vol,slideTo){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.07, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxNoise(dur,vol,freq){
  if(!actx) return;
  const t = actx.currentTime;
  const len = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1,len,actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq||1800;
  const g = actx.createGain(); g.gain.value = vol||0.1;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t);
}
function sfxStyle(style){
  if(style==='water'){ sfx(520+rand(-50,60),0.14,'sine',0.05,980); sfxNoise(0.12,0.045,2600); }
  else if(style==='flame'){ sfx(190,0.2,'sawtooth',0.06,85); sfxNoise(0.18,0.07,900); }
  else if(style==='thunder'){ sfxNoise(0.09,0.09,4200); sfx(1250,0.06,'square',0.03,380); }
  else { sfxNoise(0.16,0.07,1500); sfx(720,0.1,'sine',0.03,1500); }
}

/* ================= STATE ================= */
let state = 'title';
let gameTime = 0, shake = 0, hitStop = 0, flashAlpha = 0, deathTimer = 0, bestScore = 0;
let player = null;
let demons = [], particles = [], slashes = [], texts = [], telegraphs = [];
let projectiles = [], rings = [], bolts = [], scheduled = [], ambient = [];
let wave = 0, waveState = 'idle', waveTimer = 0, score = 0, kills = 0;

const STYLE_ORDER = ['water','flame','thunder','wind'];

const TYPES = {
  grunt: { r:15, hp:40,  speed:108, dmg:9,  color:'#6a2a8a', score:100 },
  swift: { r:11, hp:26,  speed:205, dmg:6,  color:'#b03a6a', score:130 },
  brute: { r:25, hp:155, speed:74,  dmg:18, color:'#8a2a2a', score:260 },
  boss:  { r:42, hp:700, speed:88,  dmg:26, color:'#c8183a', score:1200 }
};

/* ================= FX EMITTERS ================= */
function addParticle(p){
  if(particles.length > 1400) particles.splice(0, particles.length-1400);
  particles.push(p);
}

function emitStyle(style, x, y, dir, power, count){
  const n = count!==undefined ? count : Math.round(4 + power*10);
  for(let i=0;i<n;i++){
    const a = dir + rand(-1.25,1.25);

    if(style==='water'){
      const s = rand(40,200)*(0.5+power);
      addParticle({
        kind:'bubble', x:x+rand(-9,9), y:y+rand(-9,9),
        vx:Math.cos(a)*s*0.6, vy:Math.sin(a)*s*0.6 - rand(15,75),
        life:rand(0.4,0.95), max:0.95,
        size:rand(1.8,6), color:'#cfeeff', seed:rand(0,TAU)
      });
      if(Math.random()<0.45){
        addParticle({
          kind:'glow', spr: Math.random()<0.4?SPR.waterDeep:SPR.water,
          x:x, y:y, vx:Math.cos(a)*s*0.4, vy:Math.sin(a)*s*0.4,
          life:rand(0.18,0.36), max:0.36, size:rand(12,30), additive:true
        });
      }
    } else if(style==='flame'){
      const s = rand(70,280)*(0.5+power);
      const r = Math.random();
      addParticle({
        kind:'glow', spr: r<0.3?SPR.fireHot:(r<0.75?SPR.fire:SPR.fireDeep),
        x:x, y:y, vx:Math.cos(a)*s*0.5, vy:Math.sin(a)*s*0.5 - rand(25,100),
        life:rand(0.22,0.6), max:0.6, size:rand(11,32), additive:true
      });
    } else if(style==='thunder'){
      const s = rand(140,460)*(0.5+power);
      addParticle({
        kind:'spark', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:rand(0.09,0.26), max:0.26, size:rand(1,2.8), color:'#fff6b0'
      });
      if(Math.random()<0.25){
        addParticle({kind:'glow', spr:SPR.thunder, x:x, y:y, vx:0, vy:0, life:0.14, max:0.14, size:rand(16,30), additive:true});
      }
    } else {
      const s = rand(90,340)*(0.5+power);
      addParticle({
        kind:'spark', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:rand(0.12,0.32), max:0.32, size:rand(1,2.6), color:'#d9ffe6'
      });
      if(Math.random()<0.2){
        addParticle({kind:'glow', spr:SPR.wind, x:x, y:y, vx:Math.cos(a)*s*0.3, vy:Math.sin(a)*s*0.3, life:0.25, max:0.25, size:rand(14,28), additive:true});
      }
    }
  }
}

function spawnBlood(x,y,dir){
  for(let i=0;i<7;i++){
    const a = dir + rand(-1,1), s = rand(90,330);
    addParticle({kind:'glow', spr:SPR.blood, x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.2,0.45), max:0.45, size:rand(10,22), additive:true});
  }
}

function makeBolt(x1,y1,x2,y2,rgb,jag,life){
  const segs = [], n = 9;
  for(let i=1;i<=n;i++){
    const t = i/n, j = i===n ? 0 : jag;
    segs.push([lerp(x1,x2,t)+rand(-j,j), lerp(y1,y2,t)+rand(-j,j)]);
  }
  bolts.push({x1,y1,segs,life,max:life,rgb});
}

function addText(x,y,txt,color,size){
  texts.push({x,y,txt,color,life:0.75,max:0.75,size:size||15});
}
function schedule(delay, fn){ scheduled.push({t:delay, fn}); }

/* ================= DAMAGE QUERIES ================= */
function demonsInArc(px,py,dir,range,arc){
  const out = [];
  for(const d of demons){
    if(d.dead) continue;
    const dx = d.x-px, dy = d.y-py;
    const dist = Math.hypot(dx,dy);
    if(dist < range + d.r && Math.abs(angDiff(Math.atan2(dy,dx), dir)) < arc/2) out.push(d);
  }
  return out;
}
function demonsInRadius(px,py,r){
  const out = [];
  for(const d of demons){
    if(d.dead) continue;
    if(Math.hypot(d.x-px, d.y-py) < r + d.r) out.push(d);
  }
  return out;
}

function damageDemon(d,dmg,dir,knock){
  if(d.dead) return;
  d.hp -= dmg;
  d.hitFlash = 1;
  d.stun = Math.max(d.stun, 0.09);
  const k = (knock||1) * (d.type==='boss'?0.25 : d.type==='brute'?0.5 : 1);
  d.vx += Math.cos(dir)*300*k;
  d.vy += Math.sin(dir)*300*k;

  player.breathing = Math.min(100, player.breathing + dmg*0.16);
  player.chain++;
  player.chainT = 1.1;

  addText(d.x+rand(-8,8), d.y-d.r-4, Math.round(dmg), d.hp<=0?'#ffe28a':'#ffd0d0');
  spawnBlood(d.x,d.y,dir);
  if(d.hp<=0) killDemon(d);
}

function killDemon(d){
  d.dead = true;
  kills++;
  score += d.score;
  const big = d.type==='boss';
  const n = big?55:18;
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU, s = rand(60, big?420:260);
    addParticle({
      kind:'glow', spr: Math.random()<0.5?SPR.blood:SPR.white,
      x:d.x, y:d.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rand(0.3,0.9), max:0.9, size:rand(8, big?30:18), additive:true
    });
  }
  if(big){
    rings.push({x:d.x,y:d.y,r:10,maxR:420,life:0.85,max:0.85,color:'#ff3b5c'});
    shake = 24; hitStop = 0.13;
    sfx(120,0.85,'sawtooth',0.12,40);
  } else {
    hitStop = Math.max(hitStop, 0.035);
    sfx(300,0.15,'triangle',0.05,90);
  }
}

/* ================= FORM ARCHETYPES ================= */
function arcStrike(p,o){
  const st = STYLES[p.style], dir = p.aim;
  const hits = o.hits||1, spread = o.spread||0, arc = o.arc||PI, range = o.range||100;

  for(let i=0;i<hits;i++){
    const a = dir + (hits>1 ? (i-(hits-1)/2)*spread : 0);
    slashes.push({
      x:p.x, y:p.y, dir:a, arc, range,
      life:0.22, max:0.22, color:st.color, style:p.style, heavy:!!o.heavy
    });
    for(const d of demonsInArc(p.x,p.y,a,range,arc)) damageDemon(d,o.dmg,a,o.knock||1);
  }
  for(let k=0;k<4;k++){
    const aa = dir + rand(-arc/2, arc/2);
    const r2 = range*rand(0.6,1.05);
    emitStyle(p.style, p.x+Math.cos(aa)*r2, p.y+Math.sin(aa)*r2, aa, 0.5, 3);
  }
  if(p.style==='thunder' && Math.random()<0.6){
    makeBolt(p.x,p.y, p.x+Math.cos(dir)*range, p.y+Math.sin(dir)*range, '255,240,130', 16, 0.16);
  }
  const lunge = o.lunge!==undefined ? o.lunge : 150;
  p.vx += Math.cos(dir)*lunge;
  p.vy += Math.sin(dir)*lunge;
  shake = Math.max(shake, o.shake||3);
  sfxStyle(p.style);
}

function ringStrike(p,o){
  const st = STYLES[p.style], radius = o.radius||110;

  if(o.pull){
    for(const d of demonsInRadius(p.x,p.y,radius*1.5)){
      if(d.type==='boss') continue;
      const a = Math.atan2(p.y-d.y, p.x-d.x);
      d.vx += Math.cos(a)*420;
      d.vy += Math.sin(a)*420;
    }
    emitStyle(p.style, p.x, p.y, 0, 0.8, 12);
  }
  for(const d of demonsInRadius(p.x,p.y,radius)){
    const a = Math.atan2(d.y-p.y, d.x-p.x);
    damageDemon(d,o.dmg,a,o.knock||1.2);
  }
  rings.push({x:p.x,y:p.y,r:18,maxR:radius,life:0.42,max:0.42,color:st.glow});
  for(let k=0;k<10;k++){
    const a = Math.random()*TAU;
    emitStyle(p.style, p.x+Math.cos(a)*radius*0.85, p.y+Math.sin(a)*radius*0.85, a, 0.45, 2);
  }
  if(p.style==='thunder'){
    for(let k=0;k<5;k++){
      const a = Math.random()*TAU;
      makeBolt(p.x,p.y, p.x+Math.cos(a)*radius, p.y+Math.sin(a)*radius, '255,240,130', 18, 0.2);
    }
  }
  shake = Math.max(shake, o.shake||6);
  sfxStyle(p.style);
}

function dashStrike(p,o){
  const st = STYLES[p.style], dir = p.aim;
  const dist = o.dist||240, width = o.width||44;
  const ux = Math.cos(dir), uy = Math.sin(dir);
  const x1 = p.x, y1 = p.y;
  const x2 = x1+ux*dist, y2 = y1+uy*dist;

  for(const d of demons){
    if(d.dead) continue;
    const t = clamp(((d.x-x1)*ux + (d.y-y1)*uy)/dist, 0, 1);
    const cx = x1+ux*dist*t, cy = y1+uy*dist*t;
    if(Math.hypot(d.x-cx, d.y-cy) < width/2 + d.r) damageDemon(d,o.dmg,dir,o.knock||1.2);
  }
  for(let i=0;i<=10;i++){
    const t = i/10;
    emitStyle(p.style, lerp(x1,x2,t), lerp(y1,y2,t), dir, 0.6, 3);
  }
  slashes.push({
    x:x1,y:y1,dir,arc:PI*0.55,range:dist*0.75,
    life:0.3,max:0.3,color:st.color,style:p.style,heavy:true,streak:true
  });
  if(p.style==='thunder') makeBolt(x1,y1,x2,y2,'255,245,150',22,0.22);

  p.dashDir = dir;
  p.dashT = dist/900;
  p.invuln = Math.max(p.invuln, o.iframes||0.18);
  shake = Math.max(shake, o.shake||6);
  sfxStyle(p.style);
}

function lineStrike(p,o){
  const st = STYLES[p.style], dir = p.aim;
  const len = o.len||200, width = o.width||26;
  const ux = Math.cos(dir), uy = Math.sin(dir);
  const x1 = p.x, y1 = p.y;

  for(const d of demons){
    if(d.dead) continue;
    const t = clamp(((d.x-x1)*ux + (d.y-y1)*uy)/len, 0, 1);
    const cx = x1+ux*len*t, cy = y1+uy*len*t;
    if(Math.hypot(d.x-cx, d.y-cy) < width/2 + d.r) damageDemon(d,o.dmg,dir,o.knock||1.5);
  }
  slashes.push({
    x:x1,y:y1,dir,arc:0.34,range:len,
    life:0.26,max:0.26,color:st.color,style:p.style,heavy:true,thrust:true
  });
  for(let i=0;i<=8;i++){
    const t = i/8;
    emitStyle(p.style, x1+ux*len*t, y1+uy*len*t, dir, 0.45, 2);
  }
  p.vx += ux*200; p.vy += uy*200;
  shake = Math.max(shake, 4);
  sfxStyle(p.style);
}

function multiStrike(p,o){
  const ticks = o.ticks||5, interval = o.interval||0.1;
  for(let i=0;i<ticks;i++){
    schedule(i*interval, ()=>{
      const list = demonsInRadius(p.x,p.y,o.radius);
      for(const d of list) damageDemon(d,o.dmg, Math.atan2(d.y-p.y,d.x-p.x), o.knock||1.2);
      const st = STYLES[p.style];
      rings.push({x:p.x,y:p.y,r:22,maxR:o.radius,life:0.3,max:0.3,color:st.glow});
      for(let k=0;k<8;k++){
        const a = Math.random()*TAU;
        emitStyle(p.style, p.x+Math.cos(a)*o.radius*0.8, p.y+Math.sin(a)*o.radius*0.8, a, 0.4, 2);
      }
      shake = Math.max(shake, 4);
      sfxStyle(p.style);
    });
  }
}

function shootProj(p,o){
  const dir = p.aim;
  projectiles.push({
    x:p.x+Math.cos(dir)*26, y:p.y+Math.sin(dir)*26,
    vx:Math.cos(dir)*(o.speed||640), vy:Math.sin(dir)*(o.speed||640),
    r:o.r||28, dmg:o.dmg, life:o.life||1.15, maxLife:o.life||1.15,
    style:p.style, hit:new Set()
  });
  p.vx -= Math.cos(dir)*120;
  p.vy -= Math.sin(dir)*120;
  emitStyle(p.style, p.x+Math.cos(dir)*30, p.y+Math.sin(dir)*30, dir, 0.7, 10);
  shake = Math.max(shake, 5);
  sfxStyle(p.style);
}

const A  = o => p => arcStrike(p,o);
const R  = o => p => ringStrike(p,o);
const D  = o => p => dashStrike(p,o);
const L  = o => p => lineStrike(p,o);
const M  = o => p => multiStrike(p,o);
const PR = o => p => shootProj(p,o);

/* ================= BREATHING STYLES (canon forms) ================= */
const STYLES = {

  /* ---------- WATER: 10 combat forms + 11th ult ---------- */
  water: {
    key:'water', name:'WATER', kanji:'水',
    color:'#c7f0ff', glow:'#3fa9ff',
    forms: [
      {name:'Water Surface Slash', cost:10, cd:0.18, run:A({dmg:22, range:108, arc:1.35*PI, knock:1.1, lunge:175})},
      {name:'Water Wheel',         cost:16, cd:0.45, run:R({dmg:26, radius:94,  knock:1.4})},
      {name:'Flowing Dance',       cost:20, cd:0.60, run:D({dmg:42, dist:250, width:50, iframes:0.22, knock:1.2})},
      {name:'Striking Tide',       cost:22, cd:0.55, run:A({dmg:14, range:126, arc:1.15*PI, hits:3, spread:0.55, knock:1})},
      {name:'Blessed Rain After the Drought', cost:26, cd:0.80, run:L({dmg:60, len:175, width:36, knock:2.2})},
      {name:'Whirlpool',           cost:28, cd:0.85, run:R({dmg:34, radius:128, knock:1.6, pull:true})},
      {name:'Drop Ripple Thrust',  cost:18, cd:0.50, run:L({dmg:44, len:240, width:20, knock:1.4})},
      {name:'Waterfall Basin',     cost:30, cd:0.90, run:A({dmg:48, range:152, arc:0.95*PI, knock:2.4, heavy:true})},
      {name:'Splashing Water Flow',cost:22, cd:0.70, run:D({dmg:30, dist:300, width:44, iframes:0.34, knock:1.3})},
      {name:'Constant Flux',       cost:40, cd:1.20, run:M({dmg:15, ticks:6, interval:0.10, radius:118, knock:1.3})}
    ],
    ult: {
      name:'Dead Calm', num:'11th Form',
      run(p){
        p.invuln = Math.max(p.invuln, 0.7);
        for(const d of demonsInRadius(p.x,p.y,230))
          damageDemon(d, 100, Math.atan2(d.y-p.y,d.x-p.x), 3);

    hp:100, maxHp:100,
    stamina:100, maxStamina:100, stamDelay:0,
    breathing:0,
    aim:0, atkCd:0,
    dashT:0, dashCd:0, dashDir:0,
    invuln:0, hurtFlash:0,
    style:'water', formIdx:0,
    ultLock:0, stepPhase:0,
    chain:0, chainT:0
  };
  demons = []; particles = []; slashes = []; texts = [];
  telegraphs = []; projectiles = []; rings = []; bolts = [];
  scheduled = [];
  wave = 0; waveState = 'idle'; waveTimer = 1.5;
  score = 0; kills = 0;
  gameTime = 0; shake = 0; hitStop = 0;
  flashAlpha = 0; deathTimer = 0;
}

/* ================= SPAWNING ================= */
function findSpawnPos(){
  let best = {x:rand(70,W-70), y:rand(70,H-70)};
  for(let i=0;i<40;i++){
    const x = rand(70,W-70), y = rand(70,H-70);
    if(Math.hypot(x-player.x, y-player.y) > 290) return {x,y};
    best = {x,y};
  }
  return best;
}
function pickType(w){
  const r = Math.random();
  if(w>=4 && r<0.22) return 'brute';
  if(w>=2 && r<0.58) return 'swift';
  return 'grunt';
}
function startWave(){
  wave++;
  const isBoss = wave % 5 === 0;
  const count = Math.min(3 + Math.floor(wave*1.05), 13);
  for(let i=0;i<count;i++){
    const p = findSpawnPos();
    const type = pickType(wave);
    const delay = 0.55 + i*0.13;
    telegraphs.push({x:p.x, y:p.y, t:delay, max:delay, type, r:TYPES[type].r});
  }
  if(isBoss){
    const p = findSpawnPos();
    telegraphs.push({x:p.x, y:p.y, t:1.7, max:1.7, type:'boss', r:TYPES.boss.r});
    sfx(90,0.9,'sawtooth',0.09,45);
  }
  waveState = 'active';
  sfx(330,0.22,'triangle',0.05,520);
}
function makeDemon(type,x,y){
  const t = TYPES[type];
  const hpScale = 1 + (wave-1)*0.14;
  const spScale = 1 + Math.min(wave-1,12)*0.025;
  return {
    type, x, y, vx:0, vy:0, r:t.r,
    hp:t.hp*hpScale, maxHp:t.hp*hpScale,
    speed:t.speed*spScale, dmg:t.dmg,
    color:t.color, score:t.score,
    seed:rand(0,100),
    hitFlash:0, stun:0, atkCd:0,
    chargeCd:2.5, windup:0, charging:0,
    cdx:0, cdy:0, dead:false
  };
}

/* ================= FORM SELECT ================= */
function selectForm(i){
  const st = STYLES[player.style];
  const n = st.forms.length;
  const ni = ((i % n) + n) % n;
  if(ni !== player.formIdx){
    player.formIdx = ni;
    sfx(620 + ni*46, 0.05, 'sine', 0.02);
  }
}

function useForm(p){
  const st = STYLES[p.style];
  const f = st.forms[p.formIdx];
  if(!f) return;
  if(p.atkCd > 0 || p.ultLock > 0 || p.dashT > 0) return;
  if(p.stamina < f.cost){ sfx(180,0.06,'square',0.02); return; }

  p.stamina -= f.cost;
  p.stamDelay = 0.30;
  p.atkCd = f.cd;
  f.run(p);
}

function useUlt(p){
  if(p.breathing < 100 || p.ultLock > 0) return;
  p.breathing = 0;
  p.ultLock = 0.35;
  STYLES[p.style].ult.run(p);
}

/* ================= PLAYER ================= */
function hurtPlayer(dmg,nx,ny){
  const p = player;
  if(p.invuln > 0) return;
  p.hp -= dmg;
  p.invuln = 0.85;
  p.hurtFlash = 1;
  p.vx += nx*420; p.vy += ny*420;
  p.chain = 0; p.chainT = 0;
  shake = Math.max(shake, 16);
  hitStop = 0.07;
  flashAlpha = 0.4;
  for(let i=0;i<14;i++){
    const a = Math.random()*TAU, s = rand(80,300);
    addParticle({kind:'glow', spr:SPR.blood, x:p.x, y:p.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.2,0.5), max:0.5, size:rand(10,24), additive:true});
  }
  sfx(140,0.25,'square',0.1,60);
  if(p.hp <= 0){ p.hp = 0; die(); }
}

function die(){
  state = 'dead';
  deathTimer = 0;
  bestScore = Math.max(bestScore, score);
  shake = 26;
  for(let i=0;i<60;i++){
    const a = Math.random()*TAU, s = rand(100,460);
    addParticle({kind:'glow', spr:Math.random()<0.5?SPR.blood:SPR.white, x:player.x, y:player.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.4,1.1), max:1.1, size:rand(10,30), additive:true});
  }
  sfx(200,1.2,'sawtooth',0.12,40);
}

function updatePlayer(dt){
  const p = player;
  p.aim = Math.atan2(input.my - p.y, input.mx - p.x);

  p.atkCd = Math.max(0, p.atkCd - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt*3);
  p.ultLock = Math.max(0, p.ultLock - dt);
  p.chainT = Math.max(0, p.chainT - dt);
  if(p.chainT <= 0) p.chain = 0;

  p.stamDelay = Math.max(0, p.stamDelay - dt);
  if(p.stamDelay <= 0) p.stamina = Math.min(p.maxStamina, p.stamina + 34*dt);
  p.breathing = Math.min(100, p.breathing + 1.6*dt);

  let ix = 0, iy = 0;
  if(input.keys['a'] || input.keys['ArrowLeft']) ix -= 1;
  if(input.keys['d'] || input.keys['ArrowRight']) ix += 1;
  if(input.keys['w'] || input.keys['ArrowUp']) iy -= 1;
  if(input.keys['s'] || input.keys['ArrowDown']) iy += 1;
  const il = Math.hypot(ix,iy);
  if(il > 0){ ix/=il; iy/=il; }

  if(p.dashT > 0){
    p.dashT -= dt;
    p.vx = Math.cos(p.dashDir)*900;
    p.vy = Math.sin(p.dashDir)*900;
    emitStyle(p.style, p.x, p.y, p.dashDir+PI, 0.35, 1);
  } else {
    const accel = 3400;
    p.vx += ix*accel*dt;
    p.vy += iy*accel*dt;
    const damp = Math.exp(-9.5*dt);
    p.vx *= damp; p.vy *= damp;
  }

  p.x += p.vx*dt;
  p.y += p.vy*dt;
  if(p.x < 30){ p.x = 30; p.vx = Math.abs(p.vx)*0.3; }
  if(p.x > W-30){ p.x = W-30; p.vx = -Math.abs(p.vx)*0.3; }
  if(p.y < 30){ p.y = 30; p.vy = Math.abs(p.vy)*0.3; }
  if(p.y > H-30){ p.y = H-30; p.vy = -Math.abs(p.vy)*0.3; }
  p.stepPhase += Math.hypot(p.vx,p.vy)*dt*0.035;

  if(Math.random() < 0.35){
    const a = Math.random()*TAU;
    emitStyle(p.style, p.x+Math.cos(a)*rand(8,22), p.y+Math.sin(a)*rand(8,22), a, 0.12, 1);
  }

  // form selection
  const nKeys = ['1','2','3','4','5','6','7','8','9','0'];
  for(let i=0;i<nKeys.length;i++){
    if(pressed.has(nKeys[i])) selectForm(i);
  }
  if(pressed.has('[')) selectForm(p.formIdx-1);
  if(pressed.has(']')) selectForm(p.formIdx+1);

  // style switch
  if(pressed.has('q')){
    const idx = STYLE_ORDER.indexOf(p.style);
    p.style = STYLE_ORDER[(idx+1) % STYLE_ORDER.length];
    p.formIdx = 0;
    emitStyle(p.style, p.x, p.y, 0, 0.9, 22);
    rings.push({x:p.x,y:p.y,r:10,maxR:70,life:0.4,max:0.4,color:STYLES[p.style].glow});
    sfx(420,0.22,'triangle',0.06,780);
  }

  // ult
  if(pressed.has('e')) useUlt(p);

  // dash
  if(pressed.has(' ') || pressed.has('Shift') || pressed.has('mouse2')){
    if(p.dashCd <= 0 && p.dashT <= 0){
      let dx = ix, dy = iy;
      if(dx===0 && dy===0){ dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
      p.dashDir = Math.atan2(dy,dx);
      p.dashT = 0.15;
      p.dashCd = 0.42;
      p.invuln = Math.max(p.invuln, 0.24);
      emitStyle(p.style, p.x, p.y, p.dashDir+PI, 0.6, 10);
      sfx(660,0.14,'sine',0.05,220);
    }
  }

  // attack
  if(input.down || input.keys['j']) useForm(p);
}

/* ================= DEMONS ================= */
function updateDemons(dt){
  const p = player;
  for(const d of demons){
    if(d.dead) continue;
    d.hitFlash = Math.max(0, d.hitFlash - dt*5);
    d.stun = Math.max(0, d.stun - dt);
    d.atkCd = Math.max(0, d.atkCd - dt);

    const dx = p.x-d.x, dy = p.y-d.y;
    const dist = Math.hypot(dx,dy) || 1;
    const nx = dx/dist, ny = dy/dist;

    if(d.type === 'boss'){
      if(d.charging > 0){
        d.charging -= dt;
        d.vx = d.cdx*800;
        d.vy = d.cdy*800;
        if(Math.random() < 0.8){
          addParticle({kind:'glow', spr:SPR.blood, x:d.x+rand(-d.r,d.r), y:d.y+rand(-d.r,d.r), vx:rand(-30,30), vy:rand(-30,30), life:0.4, max:0.4, size:rand(10,22), additive:true});
        }
      } else if(d.windup > 0){
        d.windup -= dt;
        d.vx *= Math.exp(-12*dt);
        d.vy *= Math.exp(-12*dt);
        if(d.windup <= 0){ d.charging = 0.45; sfx(160,0.3,'sawtooth',0.09,420); }
      } else {
        d.chargeCd -= dt;
        const accel = d.speed*8;
        d.vx += nx*accel*dt;
        d.vy += ny*accel*dt;
        if(d.chargeCd <= 0 && dist < 640){
          d.chargeCd = 4.2; d.windup = 0.75;
          d.cdx = nx; d.cdy = ny;
        }
      }
    } else if(d.stun <= 0){
      const accel = d.speed*8;
      d.vx += nx*accel*dt;
      d.vy += ny*accel*dt;
    }

    const damp = Math.exp(-6*dt);
    d.vx *= damp; d.vy *= damp;

    const sp = Math.hypot(d.vx,d.vy);
    const maxSp = d.type==='boss' ? 820 : d.speed*1.7;
    if(sp > maxSp){ d.vx = d.vx/sp*maxSp; d.vy = d.vy/sp*maxSp; }

    d.x = clamp(d.x + d.vx*dt, d.r, W-d.r);
    d.y = clamp(d.y + d.vy*dt, d.r, H-d.r);

    if(dist < d.r + p.r + 3 && d.atkCd <= 0 && p.invuln <= 0){
      hurtPlayer(d.dmg, nx, ny);
      d.atkCd = 0.95;
      d.vx -= nx*260; d.vy -= ny*260;
    }
  }

  // separation
  for(let i=0;i<demons.length;i++){
    const a = demons[i];
    if(a.dead) continue;
    for(let j=i+1;j<demons.length;j++){
      const b = demons[j];
      if(b.dead) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const dd = Math.hypot(dx,dy) || 0.001;
      const minD = a.r + b.r;
      if(dd < minD){
        const push = (minD-dd)*0.5;
        const ux = dx/dd, uy = dy/dd;
        const wa = b.r/(a.r+b.r), wb = a.r/(a.r+b.r);
        a.x -= ux*push*wa; a.y -= uy*push*wa;
        b.x += ux*push*wb; b.y += uy*push*wb;
      }
    }
  }

  for(let i=demons.length-1;i>=0;i--) if(demons[i].dead) demons.splice(i,1);
}

/* ================= PROJECTILES / TELEGRAPHS ================= */
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    pr.x += pr.vx*dt;
    pr.y += pr.vy*dt;
    pr.life -= dt;

    for(let k=0;k<2;k++){
      const a = Math.atan2(pr.vy,pr.vx) + PI + rand(-0.7,0.7);
      emitStyle(pr.style, pr.x+rand(-12,12), pr.y+rand(-12,12), a, 0.4, 1);
    }

    for(const d of demons){
      if(d.dead || pr.hit.has(d)) continue;
      if(Math.hypot(d.x-pr.x, d.y-pr.y) < pr.r + d.r){
        pr.hit.add(d);
        damageDemon(d, pr.dmg, Math.atan2(pr.vy,pr.vx), 1.4);
      }
    }

    if(pr.life <= 0 || pr.x < -80 || pr.x > W+80 || pr.y < -80 || pr.y > H+80){
      projectiles.splice(i,1);
    }
  }
}

function updateTelegraphs(dt){
  for(let i=telegraphs.length-1;i>=0;i--){
    const t = telegraphs[i];
    t.t -= dt;
    if(t.t <= 0){
      demons.push(makeDemon(t.type, t.x, t.y));
      if(t.type === 'boss'){
        rings.push({x:t.x,y:t.y,r:10,maxR:220,life:0.6,max:0.6,color:'#ff3b5c'});
      }
      telegraphs.splice(i,1);
    }
  }
}

/* ================= PARTICLES / TIMERS ================= */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pa = particles[i];
    if(pa.kind === 'bubble'){
      pa.vy -= 60*dt;
      pa.x += Math.sin(gameTime*5 + pa.seed)*16*dt;
    } else if(pa.kind === 'glow' && pa.additive){
      pa.vy -= 40*dt;
    }
    pa.x += pa.vx*dt;
    pa.y += pa.vy*dt;
    const damp = Math.exp(-3.2*dt);
    pa.vx *= damp; pa.vy *= damp;
    pa.life -= dt;
    if(pa.life <= 0) particles.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t = texts[i];
    t.y -= 46*dt; t.life -= dt;
    if(t.life <= 0) texts.splice(i,1);
  }
  for(let i=slashes.length-1;i>=0;i--){
    slashes[i].life -= dt;
    if(slashes[i].life <= 0) slashes.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.life -= dt;
    r.r = lerp(r.r, r.maxR, 1 - Math.pow(0.001, dt));
    if(r.life <= 0) rings.splice(i,1);
  }
  for(let i=bolts.length-1;i>=0;i--){
    bolts[i].life -= dt;
    if(bolts[i].life <= 0) bolts.splice(i,1);
  }
  for(let i=scheduled.length-1;i>=0;i--){
    const s = scheduled[i];
    s.t -= dt;
    if(s.t <= 0){ s.fn(); scheduled.splice(i,1); }
  }
}

function updateAmbient(dt){
  for(const m of ambient){
    m.x += m.vx*dt; m.y += m.vy*dt; m.ph += dt*2;
    if(m.y < -20){ m.y = H+20; m.x = rand(0,W); }
    if(m.x < -20) m.x = W+20;
    if(m.x > W+20) m.x = -20;
  }
}

/* ================= UPDATE ================= */
function update(dt, rawDt){
  gameTime += rawDt;
  updateAmbient(dt);
  if(shake > 0) shake = Math.max(0, shake - rawDt*46);
  flashAlpha = Math.max(0, flashAlpha - rawDt*2.4);

  if(state === 'title'){
    updateParticles(dt);
    if(pressed.has('mouse0') || pressed.has(' ') || pressed.has('Enter')){
      initAudio();
      reset();
      state = 'playing';
      input.down = false;
      sfx(440,0.3,'triangle',0.08,880);
    }
    pressed.clear();
    return;
  }

  if(state === 'dead'){
    deathTimer += rawDt;
    updateParticles(dt);
    updateProjectiles(dt);
    if(deathTimer > 0.8 && (pressed.has('r') || pressed.has('mouse0') || pressed.has(' '))){
      reset();
      state = 'playing';
      input.down = false;
    }
    pressed.clear();
    return;
  }

  updatePlayer(dt);
  updateDemons(dt);
  updateProjectiles(dt);
  updateTelegraphs(dt);
  updateParticles(dt);

  if(waveState === 'idle'){
    waveTimer -= dt;
    if(waveTimer <= 0) startWave();
  } else {
    if(demons.length === 0 && telegraphs.length === 0){
      waveState = 'idle';
      waveTimer = 2.4;
      player.hp = Math.min(player.maxHp, player.hp + 14);
      player.stamina = player.maxStamina;
      addText(player.x, player.y-40, 'WAVE CLEARED', '#9fe6ff', 18);
      sfx(660,0.35,'sine',0.06,990);
    }
  }

  pressed.clear();
}

/* ================= RENDER ================= */
function drawBackground(){
  const g = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, Math.max(W,H)*0.78);
  g.addColorStop(0,'#151026');
  g.addColorStop(0.55,'#0c0a15');
  g.addColorStop(1,'#05040a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(120,90,200,0.055)';
  ctx.lineWidth = 1;
  const gs = 84;
  ctx.beginPath();
  for(let x=0;x<W;x+=gs){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=0;y<H;y+=gs){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();

  for(const m of ambient){
    ctx.globalAlpha = m.a * (0.6 + 0.4*Math.sin(m.ph));
    ctx.fillStyle = '#b9a8ff';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.s, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const v = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.35, W/2,H/2, Math.max(W,H)*0.8);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
}

function drawTelegraphs(){
  for(const t of telegraphs){
    const p = 1 - t.t/t.max;
    const rad = t.r * (1.1 + p*0.9);
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.globalAlpha = 0.35 + 0.35*Math.sin(gameTime*22 + t.x);
    ctx.strokeStyle = t.type==='boss' ? '#ff1a3c' : '#ff4d6a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.stroke();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = t.type==='boss' ? '#ff1a3c' : '#ff4d6a';
    ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawRings(){
  for(const r of rings){
    const a = r.life/r.max;
    ctx.globalAlpha = a*0.65;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 + 7*a;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBolts(){
  for(const b of bolts){
    const a = b.life/b.max;
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba('+b.rgb+',0.35)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    for(const s of b.segs) ctx.lineTo(s[0], s[1]);
    ctx.stroke();

    ctx.strokeStyle = 'rgba('+b.rgb+',1)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    for(const s of b.segs) ctx.lineTo(s[0], s[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawDemons(){
  for(const d of demons){
    const t = gameTime;
    ctx.save();
    ctx.translate(d.x, d.y);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, d.r*0.62, d.r*0.9, d.r*0.38, 0, 0, TAU);
    ctx.fill();

    const wob = 1 + Math.sin(t*5 + d.seed)*0.05;
    const n = 10;
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a = (i/n)*TAU;
      const rr2 = d.r*wob*(0.86 + 0.16*Math.sin(a*3 + t*4 + d.seed));
      const px = Math.cos(a)*rr2, py = Math.sin(a)*rr2;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(0,-d.r*0.2,0, 0,0,d.r*1.25);
    grad.addColorStop(0, d.color);
    grad.addColorStop(1, '#170820');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,90,140,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if(d.hitFlash > 0){
      ctx.globalAlpha = d.hitFlash*0.85;
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    const ang = Math.atan2(player.y-d.y, player.x-d.x);
    const ex = Math.cos(ang)*d.r*0.42, ey = Math.sin(ang)*d.r*0.42;
    const px2 = Math.cos(ang+PI/2)*d.r*0.3, py2 = Math.sin(ang+PI/2)*d.r*0.3;
    const er = Math.max(1.6, d.r*0.13);

    ctx.fillStyle = d.type==='boss' ? '#fff2a8' : '#ff3b3b';
    ctx.beginPath(); ctx.arc(ex+px2, ey+py2, er, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(ex-px2, ey-py2, er, 0, TAU); ctx.fill();

    if(d.type === 'boss' && d.windup > 0){
      ctx.globalAlpha = 0.5 + 0.4*Math.sin(gameTime*40);
      ctx.strokeStyle = '#ff1a3c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0,0,d.r+10,0,TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if(d.type === 'brute' || d.type === 'boss'){
      const bw = d.r*2;
      const pct = clamp(d.hp/d.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-bw/2, -d.r-14, bw, 5);
      ctx.fillStyle = d.type==='boss' ? '#ff2a4a' : '#ff7a3a';
      ctx.fillRect(-bw/2, -d.r-14, bw*pct, 5);
    }

    ctx.restore();
  }
}

function drawPlayer(){
  const p = player;
  const st = STYLES[p.style];
  const t = gameTime;

  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, p.r*0.75, p.r*1.05, p.r*0.45, 0, 0, TAU);
  ctx.fill();

  if(p.invuln > 0 && Math.floor(t*24)%2 === 0) ctx.globalAlpha = 0.45;

  if(p.breathing >= 100){
    const pulse = 0.35 + 0.25*Math.sin(t*8);
    ctx.globalAlpha = pulse;
    const ag = ctx.createRadialGradient(0,0,p.r, 0,0,p.r*3.4);
    ag.addColorStop(0, st.glow);
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,0,p.r*3.4,0,TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // katana
  ctx.save();
  ctx.rotate(p.aim);
  const bladeLen = 42;
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = st.glow;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(12+bladeLen,0); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.strokeStyle = st.color;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(12+bladeLen,0); ctx.stroke();

  ctx.fillStyle = '#c8b06a';
  ctx.fillRect(10,-5,4,10);
  ctx.strokeStyle = '#2a1a10';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10,0); ctx.stroke();
  ctx.restore();

  const bob = Math.sin(p.stepPhase*2)*1.4;
  const bodyGrad = ctx.createRadialGradient(-4,-4-bob,2, 0,-bob,p.r*1.5);
  bodyGrad.addColorStop(0, p.hurtFlash>0 ? '#ffffff' : '#2f6f7f');
  bodyGrad.addColorStop(1, p.hurtFlash>0 ? '#ff8a8a' : '#101a26');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.arc(0,-bob,p.r,0,TAU); ctx.fill();

  ctx.strokeStyle = st.glow;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(0,-bob,p.r,0,TAU); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(200,240,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0,-bob,p.r*0.55,0.4,2.4); ctx.stroke();

  ctx.restore();
}

function drawSlashes(){
  for(const s of slashes){
    const p = 1 - s.life/s.max;
    const alpha = Math.pow(1-p, 0.85);
    ctx.save();
    ctx.globalAlpha = alpha;

    if(s.thrust || s.streak){
      ctx.translate(s.x, s.y);
      ctx.rotate(s.dir);
      const L = s.range;
      const wid = s.thrust ? 16 : 26;
      const grd = ctx.createLinearGradient(0,0,L,0);
      grd.addColorStop(0, 'rgba(255,255,255,0)');
      grd.addColorStop(0.45, s.color);
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, -wid*0.25);
      ctx.quadraticCurveTo(L*0.5, -wid*0.6, L, 0);
      ctx.quadraticCurveTo(L*0.5, wid*0.6, 0, wid*0.25);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(L,0); ctx.stroke();
    } else {
      const half = s.arc/2;
      const startA = s.dir - half;
      const sweep = Math.min(1, p*1.7);
      const head = startA + s.arc*sweep;
      const tail = startA + s.arc*Math.max(0, sweep-0.8);
      const rad = s.range*0.86;

      ctx.strokeStyle = s.color;
      ctx.lineWidth = (s.heavy?20:14)*(1-p*0.35);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(s.x, s.y, rad, tail, head);
      ctx.stroke();

      ctx.globalAlpha = alpha*0.95;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, rad, tail, head);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawProjectiles(){
  for(const pr of projectiles){
    const a = clamp(pr.life/pr.maxLife, 0, 1);
    ctx.save();
    ctx.translate(pr.x, pr.y);
    ctx.rotate(Math.atan2(pr.vy, pr.vx));
    ctx.globalAlpha = a;

    const spr = pr.style==='flame' ? SPR.fire : (pr.style==='water' ? SPR.water : (pr.style==='thunder' ? SPR.thunder : SPR.wind));
    const sz = pr.r*3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(spr, -sz/2, -sz/2, sz, sz);
    ctx.globalCompositeOperation = 'source-over';

    if(pr.style === 'flame'){
      ctx.strokeStyle = 'rgba(255,240,190,0.85)';
      ctx.lineWidth = 3;
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(-pr.r*1.2, i*9);
        ctx.lineTo(pr.r*0.9, i*4);
        ctx.stroke();
      }
    } else if(pr.style === 'thunder'){
      ctx.strokeStyle = '#fffbe0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-pr.r,0); ctx.lineTo(-pr.r*0.2, -6); ctx.lineTo(pr.r*0.4, 5); ctx.lineTo(pr.r,0);
      ctx.stroke();
    } else {
      ctx.strokeStyle = pr.style==='water' ? 'rgba(200,240,255,0.9)' : 'rgba(220,255,235,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,pr.r*0.6,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(const pa of particles){
    const a = clamp(pa.life/pa.max, 0, 1);

    if(pa.kind === 'glow'){
      const s = pa.size * (0.6 + a*0.8);
      ctx.globalAlpha = a;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(pa.spr, pa.x-s/2, pa.y-s/2, s, s);
      ctx.globalCompositeOperation = 'source-over';
    } else if(pa.kind === 'bubble'){
      ctx.globalAlpha = a*0.9;
      ctx.strokeStyle = pa.color;
      ctx.lineWidth = Math.max(1, pa.size*0.22);
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.size, 0, TAU); ctx.stroke();
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = 'rgba(160,225,255,0.18)';
      ctx.fill();
      ctx.globalAlpha = a*0.95;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(pa.x - pa.size*0.3, pa.y - pa.size*0.35, pa.size*0.22, 0, TAU);
      ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.strokeStyle = pa.color;
      ctx.lineWidth = pa.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pa.x - pa.vx*0.02, pa.y - pa.vy*0.02);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  for(const t of texts){
    const a = clamp(t.life/t.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + t.size + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(t.txt, t.x+1, t.y+1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ================= HUD ================= */
function bar(x,y,w,h,pct,c1,c2){
  ctx.fillStyle = '#160a12';
  rr(x,y,w,h,h/2); ctx.fill();
  const g = ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g;
  rr(x,y,Math.max(0,w*pct),h,h/2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1;
  rr(x,y,w,h,h/2); ctx.stroke();
}

function drawHUD(){
  const p = player;
  const st = STYLES[p.style];

  const bx = 26, by = 26;
  const bw = Math.min(300, W*0.33), bh = 14;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(bx-6, by-6, bw+12, bh*3+52, 10); ctx.fill();

  // HP
  bar(bx, by, bw, bh, clamp(p.hp/p.maxHp,0,1), '#ff2b52', '#ff9a4d');
  ctx.font = 'bold 10px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('HP ' + Math.ceil(p.hp), bx+6, by+bh-3.5);

  // Stamina
  const sy = by + bh + 8;
  bar(bx, sy, bw, bh*0.72, clamp(p.stamina/p.maxStamina,0,1), '#3a6bff', '#7fe6ff');
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('STAMINA', bx+6, sy+bh*0.72-3);

  // Breathing
  const ry = sy + bh*0.72 + 8;
  bar(bx, ry, bw, bh*0.72, clamp(p.breathing/100,0,1),
      p.style==='water'?'#1e6bff' : p.style==='flame'?'#ff4d1a' : p.style==='thunder'?'#c8a000' : '#12b06a',
      st.color);

  if(p.breathing >= 100){
    ctx.globalAlpha = 0.45 + 0.4*Math.sin(gameTime*9);
    ctx.strokeStyle = st.glow;
    ctx.lineWidth = 2;
    rr(bx-2, ry-2, bw+4, bh*0.72+4, 5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = p.breathing>=100 ? st.color : 'rgba(255,255,255,0.55)';
  ctx.fillText(p.breathing>=100 ? '[E] ' + st.ult.num + ' — ' + st.ult.name.toUpperCase() : 'BREATHING ' + Math.floor(p.breathing) + '%',
               bx+6, ry+bh*0.72-3);

  // style name
  ctx.font = 'bold 15px Georgia, serif';
  ctx.fillStyle = st.color;
  ctx.fillText(st.kanji + '  ' + st.name + ' BREATHING', bx, by + bh*3 + 34);
  ctx.font = '10px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('[Q] next style', bx, by + bh*3 + 48);

  // ---- form list ----
  const nForms = st.forms.length;
  const lh = Math.min(19, Math.max(13, (H*0.5) / nForms));
  const fx = bx, fy = by + bh*3 + 66;

  ctx.font = 'bold 10px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('FORMS  [1-0] / [/]  ·  wheel', fx, fy - 8);

  for(let i=0;i<nForms;i++){
    const f = st.forms[i];
    const y = fy + i*lh;
    const sel = i === p.formIdx;
    const affordable = p.stamina >= f.cost;

    if(sel){
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      rr(fx-5, y-2, Math.min(260, W*0.3), lh, 4); ctx.fill();
      ctx.fillStyle = st.glow;
      rr(fx-5, y-2, 3, lh, 1.5); ctx.fill();
    }

    ctx.font = (sel?'bold ':'') + '11px Georgia, serif';
    ctx.fillStyle = sel ? st.color : (affordable ? 'rgba(220,230,245,0.62)' : 'rgba(160,120,140,0.42)');
    const num = (i+1) % 10;
    ctx.fillText(num + '. ' + f.name, fx, y + lh*0.72);

    ctx.textAlign = 'right';
    ctx.font = '9px Georgia, serif';
    ctx.fillStyle = affordable ? 'rgba(150,220,255,0.6)' : 'rgba(255,120,140,0.6)';
    ctx.fillText(f.cost, fx + Math.min(255, W*0.3) - 6, y + lh*0.72);
    ctx.textAlign = 'left';
  }

  // ---- wave / score ----
  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('WAVE ' + Math.max(wave,1), W-26, 52);

  ctx.font = 'bold 15px Georgia, serif';
  ctx.fillStyle = '#ffd98a';
  ctx.fillText(score.toLocaleString(), W-26, 76);

  ctx.font = '11px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('KILLS ' + kills, W-26, 94);

  if(waveState === 'idle' && waveTimer > 0 && wave > 0){
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Georgia, serif';
    ctx.fillStyle = 'rgba(160,230,255,0.8)';
    ctx.fillText('NEXT WAVE IN ' + Math.ceil(waveTimer), W/2, 52);
  }

  if(p.chainT > 0 && p.chain > 1){
    const a = clamp(p.chainT/1.1, 0, 1);
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.font = 'bold 26px Georgia, serif';
    ctx.fillStyle = p.chain >= 15 ? '#ffb03a' : '#ffffff';
    ctx.fillText(p.chain + ' HIT', W/2, H-54);
    ctx.globalAlpha = 1;
  }

  // controls reminder
  ctx.textAlign = 'right';
  ctx.font = '10px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText('WASD move · mouse aim · LMB/J attack · SPACE dash · E ultimate · Q style', W-26, H-20);

  ctx.textAlign = 'left';
}

/* ================= TITLE / DEATH ================= */
function drawTitle(){
  ctx.fillStyle = 'rgba(4,3,10,0.74)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';

  const cy = H*0.26;

  ctx.save();
  ctx.shadowColor = '#3fa9ff';
  ctx.shadowBlur = 26;
  ctx.font = 'bold ' + Math.min(60, W*0.072) + 'px Georgia, serif';
  ctx.fillStyle = '#eaf7ff';
  ctx.fillText('BREATH OF THE BLADE', W/2, cy);
  ctx.restore();

  ctx.font = 'italic ' + Math.min(18, W*0.023) + 'px Georgia, serif';
  ctx.fillStyle = 'rgba(160,220,255,0.85)';
  ctx.fillText('— Water · Flame · Thunder · Wind —', W/2, cy+34);

  const px = W/2;
  let y = cy + 82;

  ctx.font = 'bold 13px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('CONTROLS', px, y);
  y += 24;

  ctx.font = '13px Georgia, serif';
  ctx.fillStyle = 'rgba(200,215,235,0.78)';
  const lines = [
    'WASD / Arrows — Move      ·      Mouse — Aim',
    'Left Click / J — Current Form      ·      Wheel or 1-0 — Pick Form',
    'Space / Shift / Right Click — Dash (i-frames)',
    'Q — Switch Breathing Style      ·      E — Ultimate (full breathing bar)'
  ];
  lines.forEach(l => { ctx.fillText(l, px, y); y += 22; });

  y += 8;
  ctx.font = 'bold 12px Georgia, serif';
  ctx.fillStyle = 'rgba(255,220,150,0.8)';
  ctx.fillText('11 FORMS OF WATER  ·  5 FORMS OF FLAME  ·  6 FORMS OF THUNDER  ·  8 FORMS OF WIND', px, y);
  y += 34;

  const pulse = 0.5 + 0.5*Math.sin(gameTime*3.2);
  ctx.globalAlpha = 0.55 + 0.45*pulse;
  ctx.font = 'bold 20px Georgia, serif';
  ctx.fillStyle = '#ffd98a';
  ctx.fillText('CLICK  TO  BEGIN', px, y);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'left';
}

function drawDead(){
  const a = clamp(deathTimer/0.6, 0, 1);
  ctx.fillStyle = 'rgba(30,2,8,' + (0.74*a) + ')';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.globalAlpha = a;

  ctx.save();
  ctx.shadowColor = '#ff2b52';
  ctx.shadowBlur = 24;
  ctx.font = 'bold ' + Math.min(56, W*0.068) + 'px Georgia, serif';
  ctx.fillStyle = '#ffdfe6';
  ctx.fillText('YOU HAVE FALLEN', W/2, H*0.4);
  ctx.restore();

  ctx.font = 'bold 22px Georgia, serif';
  ctx.fillStyle = '#ffd98a';
  ctx.fillText('SCORE  ' + score.toLocaleString(), W/2, H*0.4+56);

  ctx.font = '15px Georgia, serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Wave reached: ' + wave + '     Demons slain: ' + kills, W/2, H*0.4+86);
  ctx.fillText('Best score: ' + bestScore.toLocaleString(), W/2, H*0.4+110);

  if(deathTimer > 0.8){
    const pulse = 0.5 + 0.5*Math.sin(gameTime*3.4);
    ctx.globalAlpha = a*(0.5 + 0.5*pulse);
    ctx.font = 'bold 18px Georgia, serif';
    ctx.fillStyle = '#9fe6ff';
    ctx.fillText('PRESS  R  OR  CLICK  TO  RISE  AGAIN', W/2, H*0.4+168);
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ================= RENDER ================= */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  drawBackground();

  ctx.save();
  if(shake > 0.2) ctx.translate(rand(-shake,shake), rand(-shake,shake));

  drawTelegraphs();
  drawRings();
  drawDemons();
  drawProjectiles();
  if(state !== 'dead' || deathTimer < 0.15) drawPlayer();
  drawSlashes();
  drawBolts();
  drawParticles();

  ctx.restore();

  if(flashAlpha > 0){
    ctx.fillStyle = 'rgba(255,70,90,' + (flashAlpha*0.45) + ')';
    ctx.fillRect(0,0,W,H);
  }

  if(state === 'playing') drawHUD();
  if(state === 'title') drawTitle();
  if(state === 'dead') drawDead();
}

/* ================= MAIN LOOP ================= */
let last = performance.now();
function loop(ts){
  requestAnimationFrame(loop);

  let rawDt = (ts - last) / 1000;
  last = ts;
  if(!isFinite(rawDt) || rawDt < 0) rawDt = 0;
  rawDt = Math.min(rawDt, 0.05);

  let dt = rawDt;
  if(hitStop > 0){ hitStop -= rawDt; dt *= 0.12; }

  update(dt, rawDt);
  render();
}
requestAnimationFrame(loop);

})();
</script>
</body>
